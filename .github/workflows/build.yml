name: CI
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
    - master
    - release/*
  pull_request:
    branches:
    - master
    - release/*

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Build
      run: dotnet build -c Release

  test:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Test
      run: dotnet test -c Release

  aot_sourcegen_sample:
    needs: build
    name: AOT Fluent/source-gen (${{ matrix.framework }}, ${{ matrix.rid }})
    strategy:
      matrix:
        include:
        - os: ubuntu-latest
          rid: linux-x64
          framework: net10.0
          sdk: 10.0.201
          executable-suffix: ''
        - os: windows-latest
          rid: win-x64
          framework: net10.0
          sdk: 10.0.201
          executable-suffix: '.exe'
        - os: macos-latest
          rid: osx-arm64
          framework: net10.0
          sdk: 10.0.201
          executable-suffix: ''
        - os: windows-latest
          rid: win-x64
          framework: net11.0
          sdk: 11.0.100-rc.2.26504.105
          executable-suffix: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
        dotnet-version: ${{ matrix.sdk }}
    - name: Select NativeAOT SDK outside the repository
      shell: pwsh
      run: |
        '{"sdk":{"version":"${{ matrix.sdk }}","rollForward":"disable","allowPrerelease":true}}' | Set-Content -Path "${{ runner.temp }}/global.json"
    - name: Install NativeAOT toolchain
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
    - name: Publish AOT sample
      working-directory: ${{ runner.temp }}
      run: dotnet publish "${{ github.workspace }}/samples/DockSystemTextJsonSourceGenAotSample/DockSystemTextJsonSourceGenAotSample.csproj" -c Release -r ${{ matrix.rid }} -p:DockAotTargetFramework=${{ matrix.framework }} -o "${{ github.workspace }}/artifacts/aot-sourcegen-sample" -m:1
    - name: Run AOT sample
      run: ./artifacts/aot-sourcegen-sample/DockSystemTextJsonSourceGenAotSample${{ matrix.executable-suffix }}

  pack:
    needs:
    - test
    - aot_sourcegen_sample
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Pack
      run: dotnet pack -c Release -o artifacts/nuget
    - name: Upload NuGet artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nightly-nuget-packages
        path: |
          artifacts/nuget/*.nupkg
          artifacts/nuget/*.snupkg
