name: Nightly Packages

on:
  push:
    branches:
      - master

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  nightly:
    name: Build and Publish Nightly
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      NUGET_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Prepare AvalonDock framework
        uses: ./.github/actions/setup-avalondock-framework
      - name: Determine version suffix
        id: version
        run: |
          DATE=$(date -u +%Y%m%d)
          echo "version-suffix=nightly.${DATE}.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -p:VersionSuffix="${{ steps.version.outputs.version-suffix }}"

      - name: Test
        run: dotnet test -c Release --no-build --logger trx --results-directory artifacts/test --filter "Category!=Leak&FullyQualifiedName!~Leak"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-test-results
          path: artifacts/test/**/*.trx
          if-no-files-found: error
          retention-days: 7

      - name: Pack
        run: dotnet pack -c Release --no-build -p:VersionSuffix="${{ steps.version.outputs.version-suffix }}" -o artifacts/packages

      - name: Bundle Dock and framework packages
        run: |
          shopt -s nullglob
          zip -j artifacts/dock-nightly-packages.zip \
            artifacts/packages/*.nupkg artifacts/packages/*.snupkg \
            artifacts/avalondock-framework/nuget/*.nupkg \
            artifacts/avalondock-framework/nuget/*.snupkg

      - name: Upload complete package bundle
        uses: actions/upload-artifact@v4
        with:
          name: nightly-package-bundle
          path: artifacts/dock-nightly-packages.zip
          if-no-files-found: error

      - name: Check published framework dependency
        id: framework_publish
        env:
          NUGET_FEED_USERNAME: ${{ github.actor }}
          NUGET_FEED_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m unittest discover -s build/AvalonDock.Framework -p 'test_*.py'
          python3 build/AvalonDock.Framework/check_publish.py --feed "${{ env.NUGET_SOURCE }}"

      - name: Publish Dock packages to GitHub Packages
        if: steps.framework_publish.outputs.available == 'true'
        run: |
          shopt -s nullglob
          for package in artifacts/packages/*.nupkg; do
            case "$(basename "$package")" in Avalonia.*) continue ;; esac
            echo "Publishing $package..."
            dotnet nuget push "$package" \
              --api-key ${{ secrets.GITHUB_TOKEN }} \
              --source "${{ env.NUGET_SOURCE }}" \
              --skip-duplicate
          done
